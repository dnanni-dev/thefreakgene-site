<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Freak Gene</title>
  <meta name="description" content="The Freak Gene — coming soon.">
  <style>
    :root { color-scheme: light dark; --bg: #0f0f10; --fg: #f2f2f2; --muted: #9a9a9f; --accent: #c6ff3d; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 { font-size: clamp(2.5rem, 9vw, 6rem); letter-spacing: -0.03em; line-height: 1; }
    h1 span { color: var(--accent); }
    p { margin-top: 1rem; color: var(--muted); font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <h1>The Freak <span>Gene</span></h1>
    <p>Coming soon</p>
  </main>
</body>
</html>
